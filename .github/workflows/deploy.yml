name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  provision:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      droplet_ip: ${{ steps.droplet.outputs.ip }}

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # ── SSH Key ──────────────────────────────────────────────────
      - name: Ensure SSH key exists in DO
        id: ssh-key
        run: |
          KEY_ID=$(doctl compute ssh-key list --format ID,Name --no-header | grep memai-deploy | awk '{print $1}')
          if [ -z "$KEY_ID" ]; then
            echo "Creating SSH key in DigitalOcean..."
            echo "${{ secrets.VPS_SSH_PUBLIC_KEY }}" > /tmp/memai-key.pub
            KEY_ID=$(doctl compute ssh-key import memai-deploy --public-key-file /tmp/memai-key.pub --format ID --no-header)
            rm /tmp/memai-key.pub
            echo "Created SSH key: $KEY_ID"
          else
            echo "SSH key already exists: $KEY_ID"
          fi
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"

      # ── Droplet ──────────────────────────────────────────────────
      - name: Ensure droplet exists
        id: droplet
        run: |
          IP=$(doctl compute droplet list --format Name,PublicIPv4 --no-header | grep memai-prod | awk '{print $2}')
          if [ -z "$IP" ]; then
            echo "Creating droplet memai-prod in sgp1..."
            IP=$(doctl compute droplet create memai-prod \
              --size s-1vcpu-2gb \
              --image docker-20-04 \
              --region sgp1 \
              --ssh-keys ${{ steps.ssh-key.outputs.key_id }} \
              --enable-monitoring \
              --enable-backups \
              --tag-names memai,production \
              --wait \
              --format PublicIPv4 \
              --no-header)
            echo "Created droplet with IP: $IP"
            echo "new_droplet=true" >> "$GITHUB_OUTPUT"
          else
            echo "Droplet already exists with IP: $IP"
            echo "new_droplet=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      # ── Firewall ─────────────────────────────────────────────────
      - name: Ensure firewall exists
        run: |
          FW_ID=$(doctl compute firewall list --format ID,Name --no-header | grep memai-fw | awk '{print $1}')
          DROPLET_ID=$(doctl compute droplet list --format ID,Name --no-header | grep memai-prod | awk '{print $1}')

          if [ -z "$FW_ID" ]; then
            echo "Creating firewall memai-fw..."
            doctl compute firewall create \
              --name memai-fw \
              --inbound-rules "protocol:tcp,ports:22,address:0.0.0.0/0,address:::/0 protocol:tcp,ports:80,address:0.0.0.0/0,address:::/0 protocol:tcp,ports:443,address:0.0.0.0/0,address:::/0" \
              --outbound-rules "protocol:tcp,ports:all,address:0.0.0.0/0,address:::/0 protocol:udp,ports:all,address:0.0.0.0/0,address:::/0 protocol:icmp,address:0.0.0.0/0,address:::/0" \
              --droplet-ids "$DROPLET_ID"
            echo "Firewall created and attached to droplet"
          else
            echo "Firewall already exists: $FW_ID"
            # Ensure droplet is attached
            doctl compute firewall add-droplets "$FW_ID" --droplet-ids "$DROPLET_ID" 2>/dev/null || true
          fi

      # ── Wait for cloud-init (new droplets only) ──────────────────
      - name: Wait for droplet to be ready
        if: steps.droplet.outputs.new_droplet == 'true'
        run: |
          echo "Waiting for cloud-init to finish on ${{ steps.droplet.outputs.ip }}..."
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key root@${{ steps.droplet.outputs.ip }} "test -f /var/lib/cloud/instance/boot-finished" 2>/dev/null; then
              echo "Droplet is ready!"
              exit 0
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "Timed out waiting for cloud-init"
          exit 1

      - name: Print droplet IP
        run: |
          echo "========================================="
          echo "Droplet IP: ${{ steps.droplet.outputs.ip }}"
          echo ""
          echo "Point your DNS records to this IP:"
          echo "  mem-ai.chuongdang.com      → ${{ steps.droplet.outputs.ip }}"
          echo "  api.mem-ai.chuongdang.com   → ${{ steps.droplet.outputs.ip }}"
          echo "========================================="

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: provision

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ needs.provision.outputs.droplet_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy files to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml Caddyfile \
            root@${{ needs.provision.outputs.droplet_ip }}:/opt/memai/

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ needs.provision.outputs.droplet_ip }} bash -s << 'DEPLOY_SCRIPT'
          set -e
          cd /opt/memai

          # Ensure directory exists
          mkdir -p /opt/memai

          # Login to GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Write env file
          cat > .env << 'ENVEOF'
          DOMAIN=${{ secrets.DOMAIN }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          API_URL=${{ secrets.API_URL }}
          DASHBOARD_URL=${{ secrets.DASHBOARD_URL }}
          CORS_ORIGIN=${{ secrets.DASHBOARD_URL }}
          EMBEDDING_PROVIDER=none
          GHCR_PREFIX=ghcr.io/${{ github.repository }}
          ENVEOF

          # Pull latest images
          docker compose pull api dashboard

          # Start/restart all services
          docker compose up -d --remove-orphans

          # Run migrations
          docker compose exec -T api node packages/api/dist/db/migrate.js || true

          # Health check (retry up to 30s)
          for i in $(seq 1 6); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null 2>&1; then
              echo "Health check passed!"
              curl -s http://localhost:3000/api/v1/health
              exit 0
            fi
            echo "Waiting for API... (attempt $i/6)"
            sleep 5
          done
          echo "Warning: health check did not pass within 30s"
          docker compose logs --tail 20 api
          DEPLOY_SCRIPT

      - name: Deployment summary
        run: |
          echo "Deploy complete!"
          echo "Dashboard: https://mem-ai.chuongdang.com"
          echo "API:       https://api.mem-ai.chuongdang.com"
